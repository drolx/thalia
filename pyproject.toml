[build-system]
requires = ["setuptools>=64", "pyinstaller", "pytest", "ruff", "alembic"]
build-backend = "setuptools.build_meta"

[project]
name = "thalia"
version = "0.1.0"
description = "An easy to use python background task scheduler"
requires-python = ">=3.11"

license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "drolx Labs", email = "dev@drolx.com" }]
urls = { Homepage = "https://github.com/drolx/pepper-local" }

keywords = ["Jobs", "Tasks", "Background", "Tool", "Utility"]
classifiers = [
    "Development Status :: 0.1 - Alpha/Experimental",
    "Environment :: Other Environment",
    "Intended Audience :: Utility",
    "License :: OSI Approved :: MIT",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Background Task Runner",
]
dependencies = [
    "pysqlite3>=0.5.4",
    "SQLAlchemy==2.0.36",
    "marshmallow_sqlalchemy==1.1.0",
    "dependency-injector>=4.44.0",
    "PyYAML>=6.0.2",
    "aiohttp==3.11.11",
    "aiojobs==1.3.0",
    "click>=8.1.8",
    "crontab>=1.0.1",
]

[dependency-groups]
dev = [
    "autopep695==1.1.4",
    "pylint==3.3.2",
    "flake8==7.1.1",
    "pytest==8.3.4",
    "black==24.10.0",
]

[project.scripts]
app = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["thalia"]
include = ["thalia"]
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
app = ['*.json', '*.yaml', '.yml', '*.html', '*.css', '*.js']
